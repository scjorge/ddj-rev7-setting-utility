; ============================================================
; DDJ-REV7 - configuration (INI, human-editable)
; ============================================================
; Generated from the USB capture.
;
; HOW TO USE:
;  - Each [section] is one controller setting.
;  - enabled = yes  -> send this setting
;  - enabled = no   -> skip it
;  - option = <number> -> pick which value to send.
;    The numbered choices are listed just above the "option =" line.
;    To switch: change the number after "=" to one of the listed numbers.
;  - Lines starting with ";" are comments (ignored).
;
; NOTE: settings are volatile (lost when the controller is powered off)
;       and are per USB port. Re-send on power-up, on the same port the
;       iPad/PC will use.
; [verify] = value<->label order was inferred from the UI; confirm in the
;            official app.

[device]
; do not change
id_vendor  = 0x2B73
id_product = 0x003B

; ------------------------------------------------------------
; DDJ OUTPUT routing - port USB1/2
; ------------------------------------------------------------
[routing_usb1_2]
enabled = yes
; choices (set "option" to one of these numbers):
;   1 = MIX (REC OUT with MIC)
;   2 = MIX (REC OUT without MIC)
;   3 = Post CH1 Fader
;   4 = CROSSFADER A
;   5 = CROSSFADER B
;   6 = MIC
;   7 = AUX
;   8 = Control Tone
option = 8

